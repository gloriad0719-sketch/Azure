    function isDateBetween(date, startStr, endStr) { const d = new Date(date); const start = new Date(startStr); const end = new Date(endStr); return d >= start && d <= end; }
    
    // ================= 新增：获取强制指定复刻的时间安排 =================
    function getConfirmedRerunSchedule() {
        const currentNew = getCurrentNewGacha();
        if (!currentNew) return { first: null, second: null, firstStartDate: null, firstEndDate: null, secondStartDate: null, secondEndDate: null };
        
        const confirmed = USER_CONFIRMED[currentNew.nick];
        if (!confirmed) return { first: null, second: null, firstStartDate: null, firstEndDate: null, secondStartDate: null, secondEndDate: null };
        
        const firstGacha = gachaData.find(g => g.nick === confirmed.firstRerun);
        const secondGacha = gachaData.find(g => g.nick === confirmed.secondRerun);
        
         // 当前新阁开启时间（复刻基于当前新阁的开启时间计算）
        const currentNewStartDate = new Date(currentNew.firstStart);
        
        // 第一次复刻：当前新阁开启后第8天
        const firstStartDate = new Date(currentNewStartDate);
        firstStartDate.setDate(currentNewStartDate.getDate() + 8);
        const firstEndDate = new Date(firstStartDate);
        firstEndDate.setDate(firstStartDate.getDate() + 21);
        
        // 第二次复刻：当前新阁开启后第15天
        const secondStartDate = new Date(currentNewStartDate);
        secondStartDate.setDate(currentNewStartDate.getDate() + 15);
        const secondEndDate = new Date(secondStartDate);
        secondEndDate.setDate(secondStartDate.getDate() + 21);
        
        return {
            first: firstGacha,
            second: secondGacha,
            firstStartDate, firstEndDate,
            secondStartDate, secondEndDate
        };
    }
    
    // ================= 修改：正在进行的限时阁（添加强制指定复刻） =================
    function getCurrentGachas() { 
        const current = []; 
        const now = CURRENT_DATE;
        // 1. 当前新阁
        for (const g of gachaData) { 
            if (isDateBetween(now, g.firstStart, g.firstEnd)) { 
                current.push({ ...g, type: "当前新阁", displayDate: `${g.firstStart} ~ ${g.firstEnd}`, displayName: `${g.officialName} · ${g.nick}` }); 
            } 
        }
        
        // 2. 强制指定复刻（如果已开启）
        const schedule = getConfirmedRerunSchedule();
        if (schedule.first && schedule.firstStartDate && schedule.firstEndDate) {
            const firstStartStr = schedule.firstStartDate.toISOString().slice(0,10);
            const firstEndStr = schedule.firstEndDate.toISOString().slice(0,10);
            if (isDateBetween(now, firstStartStr, firstEndStr)) {
                current.push({ ...schedule.first, type: "第一次复刻", displayDate: `${firstStartStr} ~ ${firstEndStr}`, displayName: `${schedule.first.officialName} · ${schedule.first.nick}` });
            }
        }
        if (schedule.second && schedule.secondStartDate && schedule.secondEndDate) {
            const secondStartStr = schedule.secondStartDate.toISOString().slice(0,10);
            const secondEndStr = schedule.secondEndDate.toISOString().slice(0,10);
            if (isDateBetween(now, secondStartStr, secondEndStr)) {
                current.push({ ...schedule.second, type: "第二次复刻", displayDate: `${secondStartStr} ~ ${secondEndStr}`, displayName: `${schedule.second.officialName} · ${schedule.second.nick}` });
            }
        }
        
        // 3. 历史遗留的复刻阁（从 reissue 数组）
        for (const g of gachaData) { 
            for (let i = 0; i < g.reissue.length; i++) { 
                const rerunStart = g.reissue[i]; 
                const rerunEnd = new Date(rerunStart); 
                rerunEnd.setDate(rerunEnd.getDate() + 21); 
                const endStr = `${rerunEnd.getFullYear()}-${String(rerunEnd.getMonth()+1).padStart(2,'0')}-${String(rerunEnd.getDate()).padStart(2,'0')}`; 
                if (isDateBetween(now, rerunStart, endStr)) { 
                    const rerunType = i === 0 ? "第一次复刻" : (i === 1 ? "第二次复刻" : `${i+1}次复刻`); 
                    current.push({ ...g, type: rerunType, displayDate: `${rerunStart} ~ ${endStr}`, displayName: `${g.officialName} · ${g.nick}` }); 
                    break; 
                } 
            } 
        }
        
        // 去重
        const unique = [];
        const ids = new Set();
        for (const item of current) {
            if (!ids.has(item.id)) {
                ids.add(item.id);
                unique.push(item);
            }
        }
        
        unique.sort((a,b) => {
            if (a.type === "当前新阁" && b.type !== "当前新阁") return -1;
            if (a.type !== "当前新阁" && b.type === "当前新阁") return 1;
            return 0;
        });
        return unique; 
    }
    
    // ================= 修改：即将开启的复刻阁（添加强制指定复刻） =================
    function getUpcomingReruns() { 
        const upcoming = []; 
        const now = CURRENT_DATE;
        
        // 强制指定复刻（如果未开启）
        const schedule = getConfirmedRerunSchedule();

        // 历史复刻

                    const rerunType = i === 0 ? "第一次复刻" : (i === 1 ? "第二次复刻" : `${i+1}次复刻`);

        }
        
        unique.sort((a,b) => new Date(a.displayDate.split(' ~ ')[0]) - new Date(b.displayDate.split(' ~ ')[0]));
        return unique; 
    }
    
    function jumpToGacha(gachaNick) { const gacha = gachaData.find(g => g.nick === gachaNick); if (!gacha) return; setPage(gacha.star === 5 ? "five" : "six"); setTimeout(() => { const card = document.querySelector(`.gacha-card[data-gacha-id="${gacha.id}"]`); if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); card.style.boxShadow = "0 0 0 3px #d9aa8b, 0 8px 20px rgba(0,0,0,0.15)"; setTimeout(() => { card.style.boxShadow = ""; }, 1500); } }, 100); }
    function getMonthsSince(dateStr, fromDate) { const target = new Date(dateStr); const diffYears = fromDate.getFullYear() - target.getFullYear(); const diffMonths = fromDate.getMonth() - target.getMonth(); return diffYears * 12 + diffMonths; }
    function formatYMD(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    function formatDateShort(date) { if (!date) return ''; return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} `; }
    
    // ================= 修改：分类池（复刻期间排除被指定的阁子） =================
    function classifyGachas(currentDate, excludeIds = []) { 
        const overdue = [], onceReissued = [], twiceReissued = [], neverReissued = [];
        
        // 获取强制指定复刻的排除ID（复刻期间排除）
        const schedule = getConfirmedRerunSchedule();
        const tempExcludeIds = [...excludeIds];
        if (schedule.first && schedule.firstStartDate && schedule.firstEndDate) {
            // 如果在复刻周期内（从开启到结束），则排除
            if (currentDate >= schedule.firstStartDate && currentDate <= schedule.firstEndDate) {
                tempExcludeIds.push(schedule.first.id);
            }
        }
        if (schedule.second && schedule.secondStartDate && schedule.secondEndDate) {
            if (currentDate >= schedule.secondStartDate && currentDate <= schedule.secondEndDate) {
                tempExcludeIds.push(schedule.second.id);
            }
        }
        
        gachaData.forEach(g => { 
            if (tempExcludeIds.includes(g.id)) return; 
            const lastDate = g.reissue.length > 0 ? g.reissue[g.reissue.length-1] : g.firstStart; 
            const monthsSince = getMonthsSince(lastDate, currentDate); 
            const reissueCount = g.reissue.length; 
            if (monthsSince >= 18) overdue.push({ ...g, monthsSince }); 
            else if (reissueCount === 0) neverReissued.push(g); 
            else if (reissueCount === 1) onceReissued.push(g); 
            else if (reissueCount >= 2) twiceReissued.push({ ...g, monthsSince, isOverdue: monthsSince >= 18 }); 
        }); 
        const sortByLastDate = (arr) => arr.sort((a,b) => { 
            const aLast = a.reissue.length > 0 ? a.reissue[a.reissue.length-1] : a.firstStart; 
            const bLast = b.reissue.length > 0 ? b.reissue[b.reissue.length-1] : b.firstStart; 
            return new Date(aLast) - new Date(bLast); 
        }); 
        return { overdue: sortByLastDate(overdue), onceReissued: sortByLastDate(onceReissued), twiceReissued: sortByLastDate(twiceReissued), neverReissued: sortByLastDate(neverReissued) }; 
    }
    
    function getCurrentNewGacha() { const now = CURRENT_DATE; return gachaData.find(g => isDateBetween(now, g.firstStart, g.firstEnd)); }
    
    // 核心预测函数（支持用户确认覆盖）
    function generatePrediction() { 
        const currentNew = getCurrentNewGacha(); 
        if (!currentNew) return null; 
        const now = CURRENT_DATE;
        const nextPeriodStartDate = new Date(currentNew.firstEnd);
        // 查找下个新阁（数据池中是否有匹配的阁子）
        let nextGacha = null;
        for (const g of gachaData) {
            if (g.firstStart === nextPeriodStartDate.toISOString().slice(0,10)) {
                nextGacha = g;
                break;
            }
        }
        const nextStar = nextGacha ? nextGacha.star : (currentNew.star === 6 ? 5 : 6);
        const nextGachaName = nextGacha ? `${nextGacha.officialName} ✦ ${nextGacha.nick}` : `${nextStar === 6 ? '六星限时阁' : '双五星限时阁'} (待定)`;
        // 获取超过18个月未复刻的备选池ID
        const allOverdueIds = classifyGachas(now, []).overdue.map(g => g.id);
        // 从有效池中挑选复刻阁（排除备选池）
        const getFirstRerun = (starType, excludeIds) => {
            let pools = classifyGachas(now, [...excludeIds, ...allOverdueIds]);
            let candidates = pools.neverReissued.filter(g => g.star === starType);
            if (candidates.length === 0) candidates = pools.onceReissued.filter(g => g.star === starType);
            return candidates.length > 0 ? candidates[0] : null;
        };
        const getSecondRerun = (starType, excludeIds) => {
            let pools = classifyGachas(now, [...excludeIds, ...allOverdueIds]);
            let candidates = pools.onceReissued.filter(g => g.star === starType);
            if (candidates.length === 0) candidates = pools.neverReissued.filter(g => g.star === starType);
            return candidates.length > 0 ? candidates[0] : null;
        };
       // 直接从池子里动态抽取（不受 USER_CONFIRMED 影响，USER_CONFIRMED 仅用于首页显示）
        const excludeForFirst = [currentNew.id, nextGacha?.id].filter(Boolean);
        let firstRerun = getFirstRerun(nextStar === 6 ? 5 : 6, excludeForFirst);
        const excludeForSecond = [...excludeForFirst, firstRerun?.id].filter(Boolean);
        let secondRerun = getSecondRerun(nextStar === 6 ? 6 : 5, excludeForSecond);        // 下下个新阁
        const nextNextPeriodStartDate = new Date(nextPeriodStartDate);
        nextNextPeriodStartDate.setDate(nextNextPeriodStartDate.getDate() + 21);
        const nextNextStar = nextStar === 6 ? 5 : 6;
               // 获取当前新阁的强制复刻ID，用于排除（避免下下个新阁重复出现）
        const currentConfirmedIds = [];
        const currentConfirmed = USER_CONFIRMED[currentNew.nick];
        if (currentConfirmed && currentConfirmed.firstRerun) {
            const firstGacha = gachaData.find(g => g.nick === currentConfirmed.firstRerun);
            if (firstGacha) currentConfirmedIds.push(firstGacha.id);
        }
        if (currentConfirmed && currentConfirmed.secondRerun) {
            const secondGacha = gachaData.find(g => g.nick === currentConfirmed.secondRerun);
            if (secondGacha) currentConfirmedIds.push(secondGacha.id);
        }
        
        const excludeForNextNextFirst = [...excludeForSecond, secondRerun?.id, ...currentConfirmedIds].filter(Boolean);
        let nextNextFirstRerun = getFirstRerun(nextNextStar === 6 ? 5 : 6, excludeForNextNextFirst);
        const excludeForNextNextSecond = [...excludeForNextNextFirst, nextNextFirstRerun?.id].filter(Boolean);
        let nextNextSecondRerun = getSecondRerun(nextNextStar === 6 ? 6 : 5, excludeForNextNextSecond);
        // 计算复刻日期
        const firstRerunDate = new Date(nextPeriodStartDate);
        firstRerunDate.setDate(nextPeriodStartDate.getDate() + 8);
        const secondRerunDate = new Date(nextPeriodStartDate);
        secondRerunDate.setDate(nextPeriodStartDate.getDate() + 15);
        const nextNextFirstRerunDate = new Date(nextNextPeriodStartDate);
        nextNextFirstRerunDate.setDate(nextNextPeriodStartDate.getDate() + 8);
        const nextNextSecondRerunDate = new Date(nextNextPeriodStartDate);
        nextNextSecondRerunDate.setDate(nextNextPeriodStartDate.getDate() + 15);
        return { 
            nextGachaName, nextPeriodStartDate, 
            nextFirstRerun: firstRerun, nextSecondRerun: secondRerun, nextStar,
            nextNextPeriodStartDate, nextNextStar,
            nextNextFirstRerun, nextNextSecondRerun,
            firstRerunDate, secondRerunDate,
            nextNextFirstRerunDate, nextNextSecondRerunDate
        }; 
    }

                <p style="font-size:0.7rem; color:#9b7b64; margin-top:8px;">（制作者：堕落母神）</p>
            </div>
        `;return `<div class="prediction-panel"><div class="prediction-title">🔮 复刻阁预测</div><div class="prediction-card"><div class="prediction-date">📌 下个新阁：${pred.nextGachaName}</div><div class="prediction-date" style="margin-top:8px">⏰ 开启时间：${formatDateShort(pred.nextPeriodStartDate)}</div></div><div class="prediction-list"><div class="prediction-item"><h4>📅 第一次复刻 · ${formatYMD(pred.firstRerunDate)}</h4><p>✨ 预测复刻阁名：${pred.nextFirstRerun?.officialName || '待定'} ✦ ${pred.nextFirstRerun?.nick || ''}</p><p>⭐ 星级：${pred.nextFirstRerun ? starText(pred.nextFirstRerun.star) : '—'}</p></div><div class="prediction-item"><h4>📅 第二次复刻 · ${formatYMD(pred.secondRerunDate)}</h4><p>✨ 预测复刻阁名：${pred.nextSecondRerun?.officialName || '待定'} ✦ ${pred.nextSecondRerun?.nick || ''}</p><p>⭐ 星级：${pred.nextSecondRerun ? starText(pred.nextSecondRerun.star) : '—'}</p></div></div>${wrongGuessHTML}<div class="prediction-card" style="margin-top:20px"><div class="prediction-date">📌 下下个新阁预测：${starText(pred.nextNextStar)}</div><div class="prediction-date" style="margin-top:8px">⏰ 预计开启时间：${formatDateShort(pred.nextNextPeriodStartDate)}</div></div><div class="prediction-list"><div class="prediction-item"><h4>📅 第一次复刻 · ${formatYMD(pred.nextNextFirstRerunDate)}</h4><p>✨ 预测复刻阁名：${pred.nextNextFirstRerun?.officialName || '待定'} ✦ ${pred.nextNextFirstRerun?.nick || ''}</p><p>⭐ 星级：${pred.nextNextFirstRerun ? starText(pred.nextNextFirstRerun.star) : '—'}</p></div><div class="prediction-item"><h4>📅 第二次复刻 · ${formatYMD(pred.nextNextSecondRerunDate)}</h4><p>✨ 预测复刻阁名：${pred.nextNextSecondRerun?.officialName || '待定'} ✦ ${pred.nextNextSecondRerun?.nick || ''}</p><p>⭐ 星级：${pred.nextNextSecondRerun ? starText(pred.nextNextSecondRerun.star) : '—'}</p></div></div>${renderPoolGroup(pred.pools)}<div class="rule-box">📖 复刻预测规则：<br/>• 下个新阁开启时间 = 当前新阁结束日<br/>• 第一次复刻：开启后第8天（周三）<br/>• 第二次复刻：开启后第15天（周三）<br/>• 所有复刻阁从「全体阁子减去超过18个月未复刻备选池」中动态挑选<br/>• 用户可在代码顶部「USER_CONFIRMED」区域手动确认复刻阁，自动覆盖预测结果</div></div>`; }
    function renderHome(store){ const sixCount = sixStarData.length; const fiveCount = fiveStarData.length; const currentGachas = getCurrentGachas(); const upcomingReruns = getUpcomingReruns(); return `<div style="text-align:center;margin:20px 0 10px"><h2>📖 以闪亮之名·限时阁百科</h2><p>六星${sixCount} · 五星${fiveCount} (双套独立进度) | 基于您设备的当前时间</p></div><div class="home-current-panel"><div class="home-section-title">🎯 正在进行的限时阁 (${CURRENT_DATE.getFullYear()}.${CURRENT_DATE.getMonth()+1}.${CURRENT_DATE.getDate()})</div><div class="current-list-horizontal">${currentGachas.map(g => `<div class="current-card" data-jump-nick="${g.nick}"><div class="current-name">${g.displayName}<span class="current-star-badge">${g.star===6?'六星':'五星'}</span><span style="font-size:0.7rem;background:#d9aa8b20;padding:2px 8px;border-radius:20px;">${g.type}</span></div><div class="current-date">📅 ${g.displayDate}</div></div>`).join('')}</div></div><div class="home-upcoming-panel"><div class="home-section-title">🔜 即将开启的复刻阁</div><div class="current-list-horizontal">${upcomingReruns.length ? upcomingReruns.map(g => `<div class="current-card" data-jump-nick="${g.nick}"><div class="current-name">${g.displayName}<span class="current-star-badge">${g.star===6?'六星':'五星'}</span><span style="font-size:0.7rem;background:#d9aa8b20;padding:2px 8px;border-radius:20px;">${g.type}</span></div><div class="current-date">📅 ${g.displayDate}</div></div>`).join('') : '<div style="padding:16px;color:#9b7b64;">暂无即将开启的复刻阁</div>'}</div></div><div class="category-grid"><div class="cat-card five-star" data-nav="five"><span>🌸</span><h2>双五星限时阁</h2></div><div class="cat-card six-star" data-nav="six"><span>👑</span><h2>六星限时阁</h2></div><div class="cat-card" style="border-top-color:#b8c9a6" data-nav="predict"><span>🔮</span><h2>复刻预测</h2></div></div><div class="update-log-area"><strong>✨ 最终版 | 动态时间 + 用户确认覆盖</strong><br/>• 所有时间基于您设备的当前时间自动计算，无需手动修改<br/>• 预测结果自动迭代，新阁/复刻到期自动出现<br/>• 如需手动确认复刻，请在代码顶部「USER_CONFIRMED」区域填写</div></div>`; }
    function bindCurrentCardJump() { document.querySelectorAll('.current-card[data-jump-nick]').forEach(card => { card.removeEventListener('click', currentCardClickHandler); card.addEventListener('click', currentCardClickHandler); }); }
    function currentCardClickHandler(e) { const nick = this.getAttribute('data-jump-nick'); if (nick) jumpToGacha(nick); }
    function bindAllEvents(store) { document.querySelectorAll('.gacha-card').forEach(card => { const gachaId = card.getAttribute('data-gacha-id'); const gacha = gachaData.find(g=>g.id===gachaId); if(!gacha) return; const prog = getProgress(gachaId, store); const isEditing = prog.isEditing === true; const isFive = gacha.star === 5; const editBtn = card.querySelector('.edit-progress-btn'); if(editBtn && !isEditing) editBtn.onclick = (e) => { e.stopPropagation(); const newStore = loadProgress(); const cur = newStore[gachaId] || { status:"", customNote:"", isEditing:false }; if(isFive) cur.setCounts = cur.setCounts || [0,0]; else cur.collected = cur.collected || 0; cur.isEditing = true; newStore[gachaId]=cur; saveProgress(newStore); renderCurrent(); }; const saveBtn = card.querySelector('.save-progress-btn'); if(saveBtn && isEditing) saveBtn.onclick = (e) => { e.stopPropagation(); const panel = card.querySelector('.progress-panel'); let selected=''; panel.querySelectorAll('.status-btn').forEach(btn=>{ if(btn.classList.contains('active')) selected=btn.getAttribute('data-status'); }); const noteVal = panel.querySelector('.progress-note-input')?.value||''; const newStore = loadProgress(); if(isFive) { const setCounts = []; panel.querySelectorAll('.set-count').forEach((input,idx)=>{ setCounts[idx]=parseInt(input.value)||0; }); newStore[gachaId] = { status:selected, customNote:noteVal, setCounts, isEditing:false }; } else { const countVal = parseInt(panel.querySelector('.count-input')?.value)||0; newStore[gachaId] = { status:selected, customNote:noteVal, collected:Math.min(countVal,gacha.totalParts), isEditing:false }; } saveProgress(newStore); renderCurrent(); }; if(isEditing) { const panel = card.querySelector('.progress-panel'); if(panel) panel.querySelectorAll('.status-btn').forEach(btn=>{ btn.onclick = (e)=>{ e.stopPropagation(); panel.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }; }); } }); document.querySelectorAll('.gacha-card').forEach(card => { const header = card.querySelector('.card-header,.card-info'); if(header) header.addEventListener('click', (e) => { if(e.target.closest('.progress-panel')||e.target.closest('.edit-progress-btn')||e.target.closest('.save-progress-btn')) return; const id = card.getAttribute('data-gacha-id'); const data = gachaData.find(g=>g.id===id); if(data){ modalContent.innerHTML = `<h2>${data.officialName} (${data.nick})</h2><div class="modal-detail-block"><strong>📅 首次</strong> ${data.firstStart}~${data.firstEnd}<br><strong>🔄 复刻</strong> ${data.reissue.length?data.reissue.map(r=>`📌 ${r}`).join('<br>'):'暂无'}</div><div class="decom-full-list"><strong>🏪 分解商店清单</strong><br/>${data.decomposeItems.map(i=>`<p>✨ ${i}</p>`).join('')}</div><div class="modal-detail-block"><strong>📦 ${data.star===5?'双套部件数':''}</strong> ${data.star===5?data.sets.map((s,i)=>`${s}:${data.setParts[i]}件`).join(' / '):`总部件 ${data.totalParts}件`}<br/><strong>✨ 标志散件</strong> ${data.signature}</div>`; modal.style.display = "flex"; } }); }); }
    function renderStarPage(starVal, store){ let filtered = gachaData.filter(g=>g.star===starVal); if(currentSearch) filtered = filtered.filter(g=>g.officialName.includes(currentSearch)||g.nick.includes(currentSearch)||g.firstStart.includes(currentSearch)); filtered.sort((a,b)=>new Date(b.firstStart)-new Date(a.firstStart)); const title = starVal===5 ? "双五星限时阁" : "六星限时阁"; return `<div><h2 style="margin:20px 0">✨ ${title} (${filtered.length}个)</h2><div class="search-section"><div class="search-box" style="pointer-events:auto;"><span>🔍</span><input id="kwSearch" value="${escapeHtml(currentSearch)}" placeholder="搜索阁名/昵称/年份" style="pointer-events:auto; z-index:10; position:relative;"></div><button class="btn-reset" id="resetSearchBtn">重置</button></div>${renderCards(filtered, store)}</div>`;}
    function bindGlobalSearch(){ 
        setTimeout(() => {
            const inp = document.getElementById('kwSearch'); 
            const reset = document.getElementById('resetSearchBtn'); 
            if(inp) {
                inp.removeAttribute('disabled');
                inp.removeAttribute('readonly');
                inp.style.pointerEvents = 'auto';
                inp.style.opacity = '1';
                inp.style.visibility = 'visible';
                inp.onclick = function(e) { e.stopPropagation(); };
                inp.onfocus = function(e) { e.stopPropagation(); };
                
                // 关键修改：不要实时刷新，等用户完成输入（回车或失焦）后再搜索
                inp.onkeydown = function(e) {
                    // 回车键触发搜索
                    if (e.key === 'Enter') {
                        currentSearch = inp.value;
                        renderCurrent();
                    }
                };
                inp.onblur = function() {
                    // 失去焦点时触发搜索
                    if (currentSearch !== inp.value) {
                        currentSearch = inp.value;
                        renderCurrent();
                    }
                };
                // 删除原来的 oninput
            }
            if(reset) reset.onclick = ()=>{ currentSearch=""; renderCurrent(); }; 
        }, 100);
        document.querySelectorAll('.cat-card').forEach(c=>c.onclick = ()=>{ setPage(c.getAttribute('data-nav')); }); 
    }
    function renderCurrent(){ // 首次访问弹窗（只弹出一次）
    const hasVisited = localStorage.getItem("has_visited_before");
    if (!hasVisited) {
        localStorage.setItem("has_visited_before", "true");
        alert("📢 更新日志\n\n• 修复电脑端无法搜索的问题\n• 复刻预测界面新增实际复刻内容\n• 增加更新日志弹窗\n• 添加制作人员名单");
    }const store = loadProgress(); if(currentPage==="home") appRoot.innerHTML = renderHome(store); else if(currentPage==="five") appRoot.innerHTML = renderStarPage(5, store); else if(currentPage==="six") appRoot.innerHTML = renderStarPage(6, store); else if(currentPage==="predict") appRoot.innerHTML = renderPrediction(); else if(currentPage==="changelog") appRoot.innerHTML = `<div><h2 style="margin:20px 0">📝 更新日志</h2><div class="update-log-area"><ul class="changelog-list"><li><span class="changelog-date">2026-06-06</span> 【最终版】基于设备当前时间自动迭代</li><li><span class="changelog-date">2026-06-06</span> 新增用户确认区域（USER_CONFIRMED），可手动覆盖复刻预测</li><li><span class="changelog-date">2026-06-06</span> 下个新阁开启时间 = 当前新阁结束日</li><li><span class="changelog-date">2026-06-06</span> 强制指定复刻在首页正确显示（进行中/即将开启）</li><li><span class="changelog-date">2026-06-06</span> 复刻期间从分类池排除，结束后自动回归</li></ul></div></div>`; bindAllEvents(store); bindGlobalSearch(); bindCurrentCardJump(); document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active')); document.querySelector(`.nav-links a[data-page="${currentPage}"]`)?.classList.add('active'); return; }
    function setPage(page){ currentPage=page; currentSearch=""; renderCurrent(); }
    document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',(e)=>{ e.preventDefault(); setPage(a.getAttribute('data-page')); }));
    setPage('home');
})();
</script>
