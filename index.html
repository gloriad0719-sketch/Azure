    function getMonthsSince(dateStr, fromDate) { const target = new Date(dateStr); const diffYears = fromDate.getFullYear() - target.getFullYear(); const diffMonths = fromDate.getMonth() - target.getMonth(); return diffYears * 12 + diffMonths; }
    function formatYMD(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    function formatDateShort(date) { if (!date) return ''; return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} `; }
    
    // ================= 修改：分类池（复刻期间排除被指定的阁子） =================
    function classifyGachas(currentDate, excludeIds = []) { 
        const overdue = [], onceReissued = [], twiceReissued = [], neverReissued = [];
        
        // 获取强制指定复刻的排除ID（复刻期间排除）
        const schedule = getConfirmedRerunSchedule();
        const tempExcludeIds = [...excludeIds];
        if (schedule.first && schedule.firstStartDate && schedule.firstEndDate) {
            // 如果在复刻周期内（从开启到结束），则排除
            if (currentDate >= schedule.firstStartDate && currentDate <= schedule.firstEndDate) {
                tempExcludeIds.push(schedule.first.id);
            }
        }
        if (schedule.second && schedule.secondStartDate && schedule.secondEndDate) {
            if (currentDate >= schedule.secondStartDate && currentDate <= schedule.secondEndDate) {
                tempExcludeIds.push(schedule.second.id);
            }
        }
        
        gachaData.forEach(g => { 
            if (tempExcludeIds.includes(g.id)) return; 
            if (g.type === "联动") return;// 跳过联动阁
            const lastDate = g.reissue.length > 0 ? g.reissue[g.reissue.length-1] : g.firstStart; 
            const monthsSince = getMonthsSince(lastDate, currentDate); 
            const reissueCount = g.reissue.length; 
            if (monthsSince >= 18) overdue.push({ ...g, monthsSince }); 
            else if (reissueCount === 0) neverReissued.push(g); 
            else if (reissueCount === 1) onceReissued.push(g); 
            else if (reissueCount >= 2) twiceReissued.push({ ...g, monthsSince, isOverdue: monthsSince >= 18 }); 
        }); 
        const sortByLastDate = (arr) => arr.sort((a,b) => { 
            const aLast = a.reissue.length > 0 ? a.reissue[a.reissue.length-1] : a.firstStart; 
            const bLast = b.reissue.length > 0 ? b.reissue[b.reissue.length-1] : b.firstStart; 
            return new Date(aLast) - new Date(bLast); 
        }); 
        return { overdue: sortByLastDate(overdue), onceReissued: sortByLastDate(onceReissued), twiceReissued: sortByLastDate(twiceReissued), neverReissued: sortByLastDate(neverReissued) }; 
    }

  	function setupImportExport() {
        const exportBtn = document.getElementById('exportDataBtn');

        const importFile = document.getElementById('importFileInput');
        
        if (exportBtn) {
            exportBtn.onclick = () => {

                const blob = new Blob([dataStr], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `gacha_progress_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };
        }
        
        if (importBtn && importFile) {
            importBtn.onclick = () => {
                importFile.click();
            };
            
            importFile.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const importedData = JSON.parse(ev.target.result);
                        if (typeof importedData === "object" && importedData !== null) {
                            saveProgress(importedData);
                            showModal("导入成功！页面将刷新。", () => { location.reload(); });
                        } else {
                            alert("文件格式错误");
                        }
                    } catch(err) {
                        alert("解析失败，文件可能损坏");
                    }
                };
                reader.readAsText(file);
                importFile.value = "";
            };
        }
    }

    // 五星图片切换逻辑（箭头点击 + 左右滑动）
    function initCarousel(imgId, url1, url2, name1, name2) {
        const img = document.getElementById(imgId + '_img');
        const nameDiv = document.getElementById(imgId + '_name');
        const prevBtn = document.querySelector(`.carousel-prev[data-id="${imgId}"]`);
        const nextBtn = document.querySelector(`.carousel-next[data-id="${imgId}"]`);
        const dots = document.querySelectorAll(`.dot[data-id="${imgId}"]`);
        
        let currentIndex = 0; // 0:第一套, 1:第二套
        const urls = [url1, url2];
        const names = [name1, name2];
        
        function updateCarousel(index) {
            if (index < 0) index = 0;
            if (index > 1) index = 1;
            currentIndex = index;
            img.src = urls[currentIndex];
            nameDiv.textContent = names[currentIndex];
            dots.forEach((dot, i) => {
                dot.style.background = i === currentIndex ? '#d9aa8b' : '#ddd';
            });
        }
        
        // 箭头点击事件
        if (prevBtn) {
            prevBtn.onclick = (e) => {
                e.stopPropagation();
                updateCarousel(currentIndex === 0 ? 1 : 0);
            };
        }
        if (nextBtn) {
            nextBtn.onclick = (e) => {
                e.stopPropagation();
                updateCarousel(currentIndex === 0 ? 1 : 0);
            };
        }
        
        // 左右滑动支持（触摸滑动）
        let startX = 0;
        let endX = 0;
        const container = document.getElementById(imgId);
        container.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        container.addEventListener('touchend', (e) => {
            endX = e.changedTouches[0].clientX;
            const diff = endX - startX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    // 向右滑：切换到上一张（实际是另一套）
                    updateCarousel(currentIndex === 0 ? 1 : 0);
                } else {
                    // 向左滑：切换到下一张
                    updateCarousel(currentIndex === 0 ? 1 : 0);
                }
            }
        });
        
        // 鼠标滑动支持（电脑端）
        let mouseStartX = 0;
        container.addEventListener('mousedown', (e) => {
            mouseStartX = e.clientX;
            e.preventDefault();
        });
        container.addEventListener('mouseup', (e) => {
            const mouseEndX = e.clientX;
            const diff = mouseEndX - mouseStartX;
            if (Math.abs(diff) > 50) {
                updateCarousel(currentIndex === 0 ? 1 : 0);
            }
        });
    }
